<meta property="og:title" content="Folio | فولیو">

<style>
  :root{
    color-scheme:light;
    --ink:#0b1533;        /* deep navy text */
    --blue:#2147c9;       /* Folio blue */
    --blue-deep:#17359c;
    --facet:#a4cbff;      /* bird facets */
    --mist:#f3f6fc;       /* page background */
    --paper:#ffffff;
    --line:#dbe3f3;
    --muted:#55617f;
    --tint:#e9effc;
    --rose:#d63c3c;
    --amber-bg:#fff0d2; --amber-ink:#8a4b00;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--mist);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  :lang(fa){font-family:"Vazirmatn","Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.9}
  :lang(en){font-family:"Manrope","Segoe UI",system-ui,sans-serif;line-height:1.65}
  a{color:inherit}
  :focus-visible{outline:3px solid #7aa2ff;outline-offset:3px;border-radius:6px}
  .wrap{width:min(1120px,100% - 40px);margin-inline:auto}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- header ---------- */
  header.site{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:16px;height:64px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Manrope",sans-serif;font-weight:800;font-size:1.3rem;color:var(--ink);letter-spacing:-.01em}
  .brand svg{width:32px;height:32px}
  nav.links{display:flex;gap:2px;margin-inline-start:20px}
  nav.links a{padding:6px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:.93rem;font-weight:500}
  nav.links a:hover{background:var(--mist);color:var(--ink)}
  .spacer{flex:1}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--paper)}
  .lang button{border:0;background:transparent;font:inherit;font-size:.82rem;font-weight:600;color:var(--muted);padding:2px 12px;border-radius:7px;cursor:pointer;line-height:1.7}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:11px;padding:12px 24px;font:inherit;font-weight:700;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:background .15s,box-shadow .15s,border-color .15s}
  .btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .btn.primary{background:var(--blue);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 8px 20px -6px rgba(33,71,201,.55)}
  .btn.primary:hover{background:var(--blue-deep)}
  .btn.ghost{background:var(--paper);border-color:var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:#b9c7e6}
  .btn.small{padding:6px 16px;font-size:.9rem;border-radius:9px}

  /* ---------- hero ---------- */
  .hero{position:relative;overflow-x:clip;background:linear-gradient(180deg,#fff 0%,var(--mist) 100%);border-bottom:1px solid var(--line)}
  .hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:48px;align-items:center;padding:56px 0 64px}
  h1{margin:0 0 18px;font-size:clamp(1.9rem,4.4vw,3.15rem);font-weight:800;color:var(--ink)}
  :lang(fa) h1{line-height:1.45}
  :lang(en) h1{line-height:1.12;letter-spacing:-.025em}
  .lead{margin:0 0 28px;max-width:520px;color:var(--muted);font-size:1.05rem}
  .cta{display:flex;flex-wrap:wrap;gap:12px}
  .dl-meta{margin:16px 0 0;color:var(--muted);font-size:.88rem;min-height:1.7em}

  .ghost-bird{position:absolute;inset-inline-end:-110px;top:-70px;width:560px;height:560px;opacity:.3;pointer-events:none}

  /* app screenshot */
  .stage{position:relative}
  .stage img{display:block;width:100%;height:auto}

  /* ---------- sections ---------- */
  section.sec{padding-top:68px;scroll-margin-top:64px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .sec-head h2{margin:0;font-size:1.65rem;font-weight:800;letter-spacing:0}
  :lang(en) .sec-head h2{letter-spacing:-.02em}
  .sec-head p{margin:0;color:var(--muted);font-size:.95rem}

  .frame{border:1px solid var(--line);border-radius:18px;background:var(--paper);overflow:hidden}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-block-start:-1px;margin-inline-start:-1px}
  .fcell{position:relative;padding:24px 26px 26px;border-block-start:1px solid var(--line);border-inline-start:1px solid var(--line)}
  .fcell.lead-cell{background:linear-gradient(180deg,#f3f7ff,#fff)}
  .fcell svg{width:26px;height:26px;fill:none;stroke:var(--blue);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:14px;display:block}
  .fcell h3{margin:0 0 4px;font-size:1.04rem;font-weight:700}
  .fcell p{margin:0;color:var(--muted);font-size:.93rem;line-height:1.85}
  :lang(en) .fcell p{line-height:1.6}
  .soon{position:absolute;inset-block-start:22px;inset-inline-end:22px;background:var(--amber-bg);color:var(--amber-ink);font-size:.74rem;font-weight:700;padding:0 10px;border-radius:999px}

  .frow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 24px;border-top:1px solid var(--line)}
  .frow:first-child{border-top:0}
  .frow h4{margin:0;font-size:1rem;display:flex;align-items:center;gap:10px;font-weight:700}
  .dot{width:10px;height:10px;border-radius:3px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;justify-content:flex-start}
  .chips code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.78rem;padding:0 9px;border-radius:6px;background:var(--mist);border:1px solid var(--line);color:var(--ink);line-height:1.7}
  .frow .count{font-size:.84rem;color:var(--muted);white-space:nowrap}

  .plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;max-width:860px}
  .plan{position:relative;border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:28px 28px 24px}
  .plan h3{margin:0 0 14px;font-size:1.1rem;font-weight:700}
  .price{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .price .now{font-size:3.4rem;line-height:1.1;font-weight:800;color:var(--blue-deep)}
  .price .unit{font-size:1rem;font-weight:600;color:var(--ink)}
  .price .old{font-size:1.05rem;color:var(--muted);text-decoration:line-through}
  .off{background:var(--rose);color:#fff;font-size:.76rem;font-weight:700;padding:0 10px;border-radius:999px}
  .for{margin:12px 0 0;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:.93rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .plan.best{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 30px 50px -28px rgba(33,71,201,.7)}
  .plan.best .now{color:#fff}.plan.best .unit{color:#e6edff}.plan.best .old{color:#b9caf7}
  .plan.best .for{border-top-color:rgba(255,255,255,.3);color:#dbe5ff}
  .plan.best .off{background:#fff;color:var(--rose)}
  .flag{position:absolute;inset-block-start:24px;inset-inline-end:26px;background:#fff;color:var(--blue-deep);font-size:.76rem;font-weight:800;padding:0 12px;border-radius:999px}

  .contact{margin-top:22px;max-width:860px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius);padding:14px 14px 14px 22px}
  html[dir="rtl"] .contact{padding:14px 22px 14px 14px}
  .contact span{font-weight:600}

  footer{margin-top:72px;border-top:1px solid var(--line);background:var(--paper)}
  .foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:20px 0;color:var(--muted);font-size:.9rem}
  .foot a{color:var(--blue-deep);text-decoration:none;font-weight:600}
  .foot a:hover{text-decoration:underline}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .hero-grid{grid-template-columns:1fr;gap:34px;padding:44px 0 56px}
    .ghost-bird{width:380px;height:380px;top:auto;bottom:-40px;inset-inline-end:-120px}
    .lead{max-width:none}
  }
  @media (max-width:720px){
    nav.links{display:none}
    header .btn.small{display:none}
    .frow{grid-template-columns:1fr;gap:8px}
    section.sec{padding-top:52px}
    .plan{padding:24px 22px 20px}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
</head>

  function fa(s){
    return String(s).replace(/\d/g, function(d){ return "۰۱۲۳۴۵۶۷۸۹"[d]; }).replace(/\./g, "٫");
  }

  var lang = "fa";
  try { var saved = localStorage.getItem("folio-lang"); if (saved === "en" || saved === "fa") lang = saved; } catch (e) {}
  var release = null; // {version, mb}

  function renderMeta(){
    var t = T[lang];
    document.getElementById("dlMeta").innerHTML = t.meta(release ? release.version : "", release ? release.mb : "", t.sys);
    document.getElementById("footVer").textContent = release ? release.version : "";
  }

  function apply(){
    var t = T[lang];
    var root = document.documentElement;
    root.lang = lang;
    root.dir = lang === "fa" ? "rtl" : "ltr";
    document.title = t.meta_title;
    var md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute("content", t.meta_desc);
    document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t[el.getAttribute("data-i18n")]; });
    document.querySelectorAll("[data-i18n-alt]").forEach(function(el){ el.setAttribute("alt", t[el.getAttribute("data-i18n-alt")]); });
    document.querySelectorAll("[data-n]").forEach(function(el){ el.textContent = t.ext(+el.getAttribute("data-n")); });
    document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang)); });
    renderMeta();
  }

  document.querySelectorAll("[data-lang]").forEach(function(b){
    b.addEventListener("click", function(){
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem("folio-lang", lang); } catch (e) {}
      apply();
    });
  });

  // favicon from the inline bird
  (function(){
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +

      '<polygon fill="#8db3ea" points="322,218 268,385 256,412 305,468 322,468"/></svg>';
    document.getElementById("favicon").href = "data:image/svg+xml," + encodeURIComponent(svg);
  })();

  // latest release -> direct download link
  fetch("https://api.github.com/repos/" + REPO + "/releases/latest", { headers: { "Accept": "application/vnd.github+json" } })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(rel){
      var assets = rel.assets || [];
      var pick =
        assets.find(function(a){ return /(setup|install)/i.test(a.name) && /\.(exe|msi)$/i.test(a.name); }) ||
        assets.find(function(a){ return /\.(exe|msi)$/i.test(a.name); }) ||
        assets.find(function(a){ return /\.zip$/i.test(a.name); }) ||
        assets[0];
      var href = pick ? pick.browser_download_url : (rel.html_url || FALLBACK);
      document.querySelectorAll(".js-dl").forEach(function(a){ a.href = href; });
      release = {
        version: rel.tag_name || rel.name || "",
        mb: pick && pick.size ? (pick.size / 1048576).toFixed(pick.size > 10485760 ? 0 : 1) : ""
      };
      renderMeta();
    })
    .catch(function(){ /* keep the /releases/latest fallback link */ });

  apply();
})();
