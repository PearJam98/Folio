<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Folio" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Folio</title>
  <!-- Flat origami bird. Facets sit on the original crease lines; hidden edges
       run under the facet drawn on top, so scaling never leaves hairline seams.
       Palette: #a4ccff #c3ddff #8bb3ea #739ad6 (sampled from the original).
       The bird is scaled to 94% for even padding inside the canvas. -->
  <g transform="translate(15.36 15.36) scale(0.94)">
    <!-- wing underside (peeks out from behind the wing) -->
    <path fill="#739ad6" d="M322.85 218L466 82L506.96 129.5A9.4 9.4 0 0 1 503.39 144.34Z"/>
    <!-- upper wing (lower edge is one straight line to the centre point) -->
    <path fill="#8bb3ea" d="M375.5 34.8L504.11 57.59A8.95 8.95 0 0 1 508.06 73.46L322.85 218L330 120Z"/>
    <!-- tail (runs under the belly, so no seam) -->
    <path fill="#8bb3ea" d="M322.85 218L322.85 469.62A8.5 8.5 0 0 1 308.47 475.76L255.56 425.03A12 12 0 0 1 252.54 412.42L261.4 387L285 300Z"/>
    <!-- belly -->
    <path fill="#739ad6" d="M95 218L98 215L322.85 215L322.85 218L261.4 387Z"/>
    <!-- head (runs under the neck) -->
    <path fill="#a4ccff" d="M6.99 127.24A9 9 0 0 1 4.09 110.52L95 59.5L100 63L108 144.1L95 142.1Z"/>
    <!-- neck (runs under the body) -->
    <path fill="#c3ddff" d="M95 59.5L212 141.6L260 190L95 218Z"/>
    <!-- body -->
    <path fill="#a4ccff" d="M95 218L375.5 34.8L322.85 218Z"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
